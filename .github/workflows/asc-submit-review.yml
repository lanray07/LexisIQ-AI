name: Submit App Store Review

on:
  workflow_dispatch:

env:
  APP_ID: "6774482124"
  APP_VERSION: "1.0"
  PLATFORM: "IOS"
  ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID || secrets.ASC_KEY_ID }}
  ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID || secrets.ASC_ISSUER_ID }}
  ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY || secrets.APP_STORE_CONNECT_PRIVATE_KEY || secrets.ASC_PRIVATE_KEY }}
  ASC_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 || secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 || secrets.ASC_PRIVATE_KEY_BASE64 }}
  SUBSCRIPTION_GROUP_ID: "22120736"

jobs:
  submit-review:
    name: Submit version 1.0 for review
    runs-on: ubuntu-latest
    steps:
      - name: Validate App Store Connect secrets
        run: |
          set -euo pipefail
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is required."
              missing=1
            fi
          done
          if [[ -z "$ASC_PRIVATE_KEY" && -z "$ASC_PRIVATE_KEY_BASE64" ]]; then
            echo "::error::ASC_PRIVATE_KEY or ASC_PRIVATE_KEY_BASE64 is required."
            missing=1
          fi
          exit "$missing"

      - name: Submit app review
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pyjwt cryptography
          python <<'PY'
          import base64
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          import jwt

          key = os.environ.get("ASC_PRIVATE_KEY", "")
          key_base64 = os.environ.get("ASC_PRIVATE_KEY_BASE64", "")
          if key_base64:
              key = base64.b64decode(key_base64).decode()

          token = jwt.encode(
              {
                  "iss": os.environ["ASC_ISSUER_ID"],
                  "iat": int(time.time()) - 60,
                  "exp": int(time.time()) + 20 * 60,
                  "aud": "appstoreconnect-v1",
              },
              key,
              algorithm="ES256",
              headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"},
          )

          base_url = "https://api.appstoreconnect.apple.com/v1"
          app_id = os.environ["APP_ID"]
          target_product_ids = {
              "lexisiq.professional.monthly",
              "lexisiq.professional.yearly",
              "lexisiq.chambers.monthly",
          }
          review_note = (
              "No login is required. To locate the subscriptions: launch LexisIQ AI, "
              "complete onboarding with the default selections, then tap the Chambers "
              "intelligence banner on the dashboard or open More > Plans & Subscription. "
              "The paid plans use StoreKit product IDs lexisiq.professional.monthly, "
              "lexisiq.professional.yearly, and lexisiq.chambers.monthly."
          )

          def request(method, path, payload=None, *, tolerate=False):
              body = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  f"{base_url}{path}",
                  data=body,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      raw = response.read().decode()
                      return {} if not raw else json.loads(raw)
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode()
                  message = f"{method} {path} failed with {exc.code}: {detail}"
                  if tolerate:
                      print(message)
                      return {"_error": {"status": exc.code, "detail": detail}}
                  raise RuntimeError(message) from exc

          def delete_subscription_images():
              query = urllib.parse.urlencode({"fields[subscriptions]": "name,productId", "limit": "200"})
              subscriptions = request(
                  "GET",
                  f"/subscriptionGroups/{os.environ['SUBSCRIPTION_GROUP_ID']}/subscriptions?{query}",
              ).get("data", [])

              deleted = 0
              for subscription in subscriptions:
                  product_id = subscription.get("attributes", {}).get("productId")
                  if product_id not in target_product_ids:
                      continue
                  image_query = urllib.parse.urlencode({"fields[subscriptionImages]": "fileName,state", "limit": "200"})
                  images = request("GET", f"/subscriptions/{subscription['id']}/images?{image_query}").get("data", [])
                  for image in images:
                      request("DELETE", f"/subscriptionImages/{image['id']}")
                      deleted += 1
                      print(f"Deleted subscription promotional image {image['id']} for {product_id}.")
              print(f"Subscription promotional image preflight complete. Deleted {deleted} image(s).")

          def get_target_subscriptions():
              query = urllib.parse.urlencode(
                  {
                      "fields[subscriptions]": "name,productId,state,reviewNote",
                      "limit": "200",
                  }
              )
              subscriptions = request(
                  "GET",
                  f"/subscriptionGroups/{os.environ['SUBSCRIPTION_GROUP_ID']}/subscriptions?{query}",
              ).get("data", [])
              matches = []
              for subscription in subscriptions:
                  attrs = subscription.get("attributes", {})
                  product_id = attrs.get("productId")
                  if product_id in target_product_ids:
                      matches.append(subscription)
                      print(
                          "Found subscription "
                          f"{product_id} ({subscription['id']}) state={attrs.get('state')}"
                      )
              missing = target_product_ids - {
                  item.get("attributes", {}).get("productId") for item in matches
              }
              if missing:
                  raise RuntimeError(f"Missing subscription products in group: {sorted(missing)}")
              return matches

          def prepare_subscription_submissions(subscriptions):
              for subscription in subscriptions:
                  subscription_id = subscription["id"]
                  attrs = subscription.get("attributes", {})
                  product_id = attrs.get("productId")
                  state = attrs.get("state")

                  update_result = request(
                      "PATCH",
                      f"/subscriptions/{subscription_id}",
                      {
                          "data": {
                              "type": "subscriptions",
                              "id": subscription_id,
                              "attributes": {"reviewNote": review_note},
                          }
                      },
                      tolerate=True,
                  )
                  if "_error" in update_result:
                      print(f"Could not update review note for {product_id}; continuing.")
                  else:
                      print(f"Updated review note for {product_id}.")

                  if state in {"WAITING_FOR_REVIEW", "IN_REVIEW", "PENDING_BINARY_APPROVAL", "APPROVED"}:
                      print(f"Subscription {product_id} is already {state}; not creating a duplicate submission.")
                      continue

                  submit_result = request(
                      "POST",
                      "/subscriptionSubmissions",
                      {
                          "data": {
                              "type": "subscriptionSubmissions",
                              "relationships": {
                                  "subscription": {
                                      "data": {"type": "subscriptions", "id": subscription_id}
                                  }
                              },
                          }
                      },
                      tolerate=True,
                  )
                  if "_error" in submit_result:
                      print(f"Subscription submission for {product_id} was not created:")
                      print(submit_result["_error"]["detail"])
                  else:
                      print(f"Created subscription submission for {product_id}: {submit_result['data']['id']}")

          def get_version_id():
              query = urllib.parse.urlencode(
                  {
                      "filter[platform]": os.environ["PLATFORM"],
                      "filter[versionString]": os.environ["APP_VERSION"],
                      "fields[appStoreVersions]": "platform,versionString,appStoreState,appVersionState",
                      "limit": "10",
                  }
              )
              versions = request("GET", f"/apps/{app_id}/appStoreVersions?{query}").get("data", [])
              if not versions:
                  raise RuntimeError(f"No App Store version {os.environ['APP_VERSION']} found for app {app_id}.")
              version = versions[0]
              attrs = version.get("attributes", {})
              print(
                  "Found App Store version "
                  f"{attrs.get('versionString')} ({version['id']}) state="
                  f"{attrs.get('appStoreState') or attrs.get('appVersionState')}"
              )
              return version["id"]

          def list_candidate_review_submissions():
              return request(
                  "GET",
                  f"/apps/{app_id}/reviewSubmissions?limit=20&fields[reviewSubmissions]=state,submittedDate",
              ).get("data", [])

          def review_submission_items(submission_id):
              item_query = urllib.parse.urlencode(
                  {
                      "fields[reviewSubmissionItems]": "state,appStoreVersion",
                      "include": "appStoreVersion",
                      "limit": "200",
                  }
              )
              return request("GET", f"/reviewSubmissions/{submission_id}/items?{item_query}").get("data", [])

          def cancel_existing_app_version_submission(version_id):
              legacy_submission = request(
                  "GET",
                  f"/appStoreVersions/{version_id}/appStoreVersionSubmission",
                  tolerate=True,
              )
              if "_error" not in legacy_submission and legacy_submission.get("data"):
                  legacy_id = legacy_submission["data"]["id"]
                  delete_legacy = request("DELETE", f"/appStoreVersionSubmissions/{legacy_id}", tolerate=True)
                  if "_error" in delete_legacy:
                      print(f"Could not delete legacy appStoreVersionSubmission {legacy_id}.")
                  else:
                      print(f"Deleted legacy appStoreVersionSubmission {legacy_id}.")

              for submission in list_candidate_review_submissions():
                  submission_id = submission["id"]
                  state = submission.get("attributes", {}).get("state")
                  if state not in {"READY_FOR_REVIEW", "UNRESOLVED_ISSUES"}:
                      continue
                  for item in review_submission_items(submission_id):
                      item_version_id = (
                          item.get("relationships", {})
                          .get("appStoreVersion", {})
                          .get("data", {})
                          .get("id")
                      )
                      if item_version_id != version_id:
                          continue
                      delete_item = request("DELETE", f"/reviewSubmissionItems/{item['id']}", tolerate=True)
                      if "_error" in delete_item:
                          print(f"Could not delete reviewSubmissionItem {item['id']} from {submission_id}.")
                      else:
                          print(f"Deleted reviewSubmissionItem {item['id']} from {submission_id}.")

              print("Waiting briefly for App Store Connect submission-state propagation.")
              time.sleep(30)

          def submit_with_review_submissions(version_id, prefer_new=False):
              candidates = [
                  item for item in list_candidate_review_submissions()
                  if item.get("attributes", {}).get("state") in {"READY_FOR_REVIEW", "UNRESOLVED_ISSUES"}
              ]
              submission_id = None
              if candidates:
                  submission_id = candidates[0]["id"]
                  print(
                      "Reusing review submission "
                      f"{submission_id} state={candidates[0].get('attributes', {}).get('state')}."
                  )

              if prefer_new or not submission_id:
                  created = request(
                      "POST",
                      "/reviewSubmissions",
                      {
                          "data": {
                              "type": "reviewSubmissions",
                              "relationships": {
                                  "app": {"data": {"type": "apps", "id": app_id}}
                              },
                          }
                      },
                      tolerate=True,
                  )
                  if "_error" in created:
                      if not submission_id:
                          raise RuntimeError("Could not create or find a reusable review submission.")
                      print("Could not create a fresh review submission; reusing the existing one.")
                  else:
                      submission_id = created["data"]["id"]
                      print(f"Created review submission {submission_id}.")

              existing_items = review_submission_items(submission_id)
              has_version_item = any(
                  item.get("relationships", {})
                  .get("appStoreVersion", {})
                  .get("data", {})
                  .get("id") == version_id
                  for item in existing_items
              )

              if has_version_item:
                  print("App Store version is already in the review submission.")
              else:
                  item_result = request(
                      "POST",
                      "/reviewSubmissionItems",
                      {
                          "data": {
                              "type": "reviewSubmissionItems",
                              "relationships": {
                                  "reviewSubmission": {"data": {"type": "reviewSubmissions", "id": submission_id}},
                                  "appStoreVersion": {"data": {"type": "appStoreVersions", "id": version_id}},
                              },
                          }
                      },
                      tolerate=True,
                  )
                  if "_error" not in item_result:
                      print("Added App Store version to review submission.")
                  else:
                      print("Could not add App Store version to submission:")
                      print(item_result["_error"]["detail"])

              submit_result = request(
                  "PATCH",
                  f"/reviewSubmissions/{submission_id}",
                  {
                      "data": {
                          "type": "reviewSubmissions",
                          "id": submission_id,
                          "attributes": {"submitted": True},
                      }
                  },
                  tolerate=True,
              )
              if "_error" in submit_result:
                  raise RuntimeError("reviewSubmissions submit failed.")
              print(f"Submitted review submission {submission_id}.")

          def submit_with_legacy_app_store_version_submission(version_id):
              result = request(
                  "POST",
                  "/appStoreVersionSubmissions",
                  {
                      "data": {
                          "type": "appStoreVersionSubmissions",
                          "relationships": {
                              "appStoreVersion": {"data": {"type": "appStoreVersions", "id": version_id}}
                          },
                      }
                  },
              )
              print(f"Submitted with legacy appStoreVersionSubmissions endpoint: {result['data']['id']}.")

          delete_subscription_images()
          subscriptions = get_target_subscriptions()
          prepare_subscription_submissions(subscriptions)
          version_id = get_version_id()
          try:
              submit_with_review_submissions(version_id)
          except Exception as exc:
              print(f"Modern reviewSubmissions flow failed: {exc}")
              cancel_existing_app_version_submission(version_id)
              submit_with_review_submissions(version_id, prefer_new=True)
          print("App Store review submission workflow completed.")
          PY
